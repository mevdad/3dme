<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3D Me</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
  { "imports": {
      "three": "./vendor/three/three.module.js",
      "three/addons/": "./vendor/three/addons/"
  } }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>

  <aside id="panel">
    <h1 id="title">3D Me</h1>
    <div class="row">
      <button id="wave">👋 Помахать</button>
      <button id="spin">🔄 Вращение</button>
    </div>
    <label>Кожа <input type="color" data-key="skin"></label>
    <label>Волосы <input type="color" data-key="hair"></label>
    <label>Глаза <input type="color" data-key="eyes"></label>
    <label>Футболка <input type="color" data-key="shirt"></label>
    <label>Штаны <input type="color" data-key="pants"></label>
    <label>Причёска
      <select id="hairStyle">
        <option value="short">Короткая</option>
        <option value="long">Длинная</option>
        <option value="bun">Пучок</option>
        <option value="bald">Без волос</option>
      </select>
    </label>
    <label class="check"><input type="checkbox" id="glasses"> Очки</label>
    <label class="check"><input type="checkbox" id="beard"> Борода</label>
    <p class="hint">Перетащите свой <b>.glb</b> файл на сцену, чтобы заменить модель.<br>
      Мышь — вращение, колесо — масштаб.</p>
  </aside>

  <script type="module" src="src/main.js"></script>
</body>
</html>
